[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "outlier-migrate-release"
version = "0.1.0"
description = "Minimal reproducibility scaffold for OutlierMigrate"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
om-measure = "scripts.run_measurement:main"
om-intervene = "scripts.run_intervention:main"
om-analyze = "scripts.analyze_results:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
