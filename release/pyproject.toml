[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "outlier-migrate"
version = "0.1.0"
description = "Minimal reproduction package for decode-position channel drift experiments"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {text = "Apache-2.0"}
dependencies = [
  "numpy==2.1.2",
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
full = [
  "torch==2.8.0",
  "transformers==4.57.6",
  "vllm==0.10.2",
]
dev = [
  "pytest==9.0.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
