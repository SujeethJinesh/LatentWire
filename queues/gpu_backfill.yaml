    reason: first_after_overnight_screen_limited_offline_gate_headroom_needs_paired_native_forward_parity_and_three_model_sentinels
    command: "run the paired matrix in dashboard/c_a1_gpu_backfill_runbook.md: ParoQuant baseline vs tight-clip C_A1 on exact cached Granite, DeepSeek, and Falcon row IDs; abort if any model lacks same-row pairing"
    required_cache_or_model: "native W4A16/ParoQuant runner plus exact cached C_A1 gate ids; DeepSeek/Falcon require paired tight-clip wrappers, not denominator-only sentinels"
    est_gpu_hours: 2-4
    promotion_allowed: false
  - id: channel_set_c_a1_paroquant_parity_card
    priority: 2
    reason: paired_native_paroquant_parity_card_for_c_a1_before_any_promotion
