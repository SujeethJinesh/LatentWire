    command: "venv_arm64/bin/python scripts/overnight_v3_corrected_probes.py --device cpu --run-exp exp4 --exp4-prompts 300 --exp4-candidates 16 --exp4-max-new-tokens 96 --batch-size 1 --require-verifier-score --no-confirm"
    required_cache_or_model: "dev/gate generated-solution candidate pools plus source_score, target_score, and verifier_score fields; require >=80 prompts with at least one correct candidate before L_A2 screening"
